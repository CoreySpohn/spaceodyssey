name: CI

# Replaces tests.yml. Quick tier on every push and pull request, docs with executed
# examples, and the slow tier on a nightly schedule. No secrets are used: the default
# GITHUB_TOKEN with read access is enough because every sibling library is public.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 7 * * *"   # nightly, 07:17 UTC (default branch only)
  workflow_dispatch:
    inputs:
      tier:
        description: "Test selection for a manual run"
        default: "not slow"
        type: choice
        options: [ "not slow", "slow", "all" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  JAX_PLATFORMS: cpu
  # Batched programs can stall on 2-vCPU runners with the default Eigen threading.
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  # Pytest selects a worker subdirectory under this root; other commands use main.
  JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache/main
  SPACEODYSSEY_JAX_CACHE: ${{ github.workspace }}/.jax_cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "1"
  PYTHONHASHSEED: "0"
  # The budget plugin enforces per-test tier budgets measured on a laptop; one
  # process on this runner is about three times slower, so the budgets scale by 3.
  SPACEODYSSEY_BUDGET_SCALE: "3"

jobs:
  quick:
    name: Quick tier (py${{ matrix.python-version }})
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Restore the JAX compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Restore the root, including main and both pytest worker directories.
          path: .jax_cache
          key: jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-
            jax-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install the package and test tools
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # One resolve, so pinned siblings satisfy the package floors.
          uv pip install --python .venv/bin/python -e ".[test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt ruff==0.17.3 deptry ty==0.0.96

      - name: Lint and formatting
        run: |
          ruff check src/spaceodyssey tests
          ruff format --check src/spaceodyssey tests

      - name: Check dependencies
        run: deptry src/spaceodyssey

      - name: Check types (advisory)
        continue-on-error: true
        run: ty check src/spaceodyssey

      - name: Quick tier
        run: |
          # Two workers, one file each: the quick tier is compile-bound and a
          # single process runs about 3x slower here than on a laptop.
          # radis writes its user config on first import; do it once here so two
          # workers do not race on a half-written file during collection.
          python -c "import radis"
          pytest tests/ -m "not slow" -n 2 --dist loadfile -ra --tb=short \
            --timeout=300 --fail-slow=60s \
            --durations=15 --durations-min=1.0 \
            --junitxml=junit-quick.xml --budget-json budget-quick.json

      # Per-file program counts and per-test costs, for setting the file budgets.
      - name: Upload the budget summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-quick
          path: budget-quick.json
          if-no-files-found: warn

      # The quick tier, medium tests included, stays under 540 s and within 60 s of
      # the pinned baseline summary (the baseline file records its source and state).
      - name: Job summary
        if: always()
        run: |
          python .github/scripts/ci_summary.py junit-quick.xml --title "Quick tier" \
            --budget-seconds 540 --require-tier medium \
            --baseline .github/budget/quick_baseline.json --max-increase-seconds 60

  docs:
    name: Docs with executed examples
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # hatch-vcs needs tags for the docs version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jax_cache
          key: jax-docs-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: jax-docs-${{ hashFiles('pyproject.toml') }}-

      - name: Install docs dependencies
        run: |
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # One resolve, so pinned siblings satisfy the package floors.
          uv pip install --python .venv/bin/python -e ".[docs,test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt

      # Every Python fence in README.md and docs runs as a test. A block that cannot run on a
      # runner carries the info string `python notest` and a one-line reason above it.
      # docs/changes holds change records (design notes with sketches), not user docs, so
      # it is not executed.
      - name: Execute fenced code blocks
        run: |
          pytest README.md docs --ignore=docs/changes --markdown-docs --markdown-docs-syntax=superfences \
            -p no:cacheprovider --timeout=120 -ra --tb=short \
            --junitxml=junit-docs.xml

      # Executes {code-cell} blocks and notebooks, and fails on any Sphinx warning.
      - name: Build docs with execution forced
        run: |
          sphinx-build -W --keep-going -b html \
            -D nb_execution_mode=force -D nb_execution_raise_on_error=1 \
            docs docs/_build/html

      - name: Job summary
        if: always()
        run: python .github/scripts/ci_summary.py junit-docs.xml --title "Docs examples" --budget-seconds 300 --allow-skips

  slow:
    name: Slow tier
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'not slow')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the slice gates read the commit history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jax_cache
          key: jax-slow-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: jax-slow-${{ hashFiles('pyproject.toml') }}-

      - name: Install the package and test tools
        run: |
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # One resolve, so pinned siblings satisfy the package floors.
          uv pip install --python .venv/bin/python -e ".[test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt

      - name: Slow tier (hypothesis nightly profile)
        env:
          HYPOTHESIS_PROFILE: nightly
          EVENT: ${{ github.event_name }}
        run: |
          status=0
          # The current slice gate reruns checks this tier already runs, so the
          # schedule skips it; a manual slow or full run still includes it.
          skip_gate=()
          if [ "$EVENT" = "schedule" ]; then
            skip_gate=(--ignore=tests/test_slice3a_gate.py)
          fi
          # The golden pins run in their own job (below), so a slow tier that
          # overruns its limit cannot take them with it. Three workers, one file
          # each (four vCPUs, about 4.3 GB peak per worker); radis writes its config on first import,
          # so do that once before the workers start.
          python -c "import radis"
          pytest tests/ -m slow -n 3 --dist loadfile -ra --tb=short --timeout=900 \
            --ignore=tests/core/test_golden_histories.py \
            "${skip_gate[@]}" \
            --durations=25 --junitxml=junit-slow.xml || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

      - name: Job summary
        if: always()
        run: python .github/scripts/ci_summary.py junit-slow.xml --title "Slow tier" --allow-skips

  goldens:
    name: Golden pins
    # Bit-exact history pins, under the jaxlib in .github/jax-pin.txt. Nightly and on
    # a manual slow or full run, apart from the slow tier.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'not slow')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jax_cache
          key: jax-goldens-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: jax-goldens-${{ hashFiles('pyproject.toml') }}-

      - name: Install the package and test tools
        run: |
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt

      - name: Golden pins
        run: |
          pytest tests/core/test_golden_histories.py -m "" -ra --tb=short --timeout=900 \
            --durations=10 --junitxml=junit-goldens.xml

      - name: Job summary
        if: always()
        run: python .github/scripts/ci_summary.py junit-goldens.xml --title "Golden pins"
