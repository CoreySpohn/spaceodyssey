name: Pilot

# Manual-only measurement run on the hosted runner, with every compile cache off: the
# compiled executor's per-step cost (the step-cost baseline and its calibrated
# mutant) and the cold compile time of the medium study tests. Installs like the
# quick tier of ci.yml, without the JAX compile-cache restore. No secrets are used.
#
# The pilot also measures the per-step cost of the base tree (`k3_base_ref`) and of this
# commit in the same job, interleaved, and prints their ratio (tools/step_cost_pair.py);
# a ratio above 1.10 fails that step. Figures from separate jobs are not compared, since
# runner speed differs between jobs by more than the limit.
#
# With `quick_ref` set, it instead runs the whole quick tier cold at that ref (a
# commit, branch or tag) and prints its summary as JSON in the baseline format of
# .github/budget/. Dispatch it once at the reference commit and once at the commit
# to judge: the difference of the two wall times is the cold cost the change added.
# The summary also prints the cold wall time against the pinned baseline (the previous
# slice's close-out, cold). That comparison is advisory here: runner speed alone moves
# a cold run by more than the 60 s limit, so the paired dispatch, not one run, judges
# a change.

on:
  workflow_dispatch:
    inputs:
      quick_ref:
        description: "Run the whole quick tier cold at this ref (empty: the pilot)"
        default: ""
        type: string
      k3_base_ref:
        description: "Pilot only: the earlier source tree the step cost is compared with, measured in the same job (default: 97753d5, the commit before the Slice 3a core changes)"
        default: "97753d57564770664fca3b73c26840d0681dacf2"
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-${{ github.ref }}
  cancel-in-progress: false

env:
  JAX_PLATFORMS: cpu
  # Same threading as the quick tier, so the figures are comparable with it.
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  SPACEODYSSEY_JAX_CACHE: "off"
  JAX_ENABLE_COMPILATION_CACHE: "false"
  PYTHONHASHSEED: "0"

jobs:
  pilot:
    name: Step cost and cold compiles (py3.12)
    if: inputs.quick_ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install the package and test tools
        run: |
          uv venv .venv --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt

      - name: Step cost, plain and mutant
        run: |
          set -o pipefail
          python tools/step_cost.py --mutant --repeats 30 | tee step_cost.json

      - name: Cold medium study tests, one process per file
        run: |
          # Each file starts a fresh process with no compile cache, so every program
          # it needs compiles cold; a failure is reported in the summary, not here.
          for f in tests/studies/test_survey_5.py tests/studies/test_survey_2.py \
                   tests/studies/test_survey_2_calibration.py; do
            name=$(basename "$f" .py)
            pytest "$f" -m "not slow" -p no:cacheprovider -ra --tb=short \
              --testbudget-mode report \
              --timeout=600 --durations=0 --junitxml="junit-pilot-$name.xml" || true
          done

      # The base tree gets its own copy of the probe and its own package: each tree is
      # measured by its own code, in fresh processes, alternating base and final.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.k3_base_ref }}
          path: base-tree
          persist-credentials: false

      - name: Step cost, base tree and this tree in one job (K3)
        run: |
          set -o pipefail
          # The version module is generated at install time and is not tracked.
          cp src/spaceodyssey/_version.py base-tree/src/spaceodyssey/_version.py
          python tools/step_cost_pair.py --base-tree base-tree --final-tree . \
            --rounds 5 --repeats 30 | tee step_cost_pair.json

      - name: Job summary
        if: always()
        run: |
          python .github/scripts/pilot_summary.py step_cost.json step_cost_pair.json \
            junit-pilot-*.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

  quick-cold:
    name: Quick tier cold at ${{ inputs.quick_ref }} (py3.12)
    if: inputs.quick_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.quick_ref }}
          persist-credentials: false

      # The summary script of this workflow's own commit, which an older ref lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: budget-tools
          sparse-checkout: .github
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install the package and test tools
        run: |
          uv venv .venv --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[test]" --override .github/sibling-pins.txt --override .github/jax-pin.txt

      - name: Quick tier, cold
        run: |
          # The quick-tier selection and workers of ci.yml. Cold tests exceed their
          # laptop budgets by design, so the budget plugin only reports here; a
          # failing test is reported in the log and does not stop the measurement.
          # radis writes its user config on first read (newer releases load it lazily); read it once here so two
          # workers do not race on a half-written file during collection.
          python -c "import radis; radis.config['OLDEST_COMPATIBLE_VERSION']" && test -s ~/radis.json
          pytest tests/ -m "not slow" -n 2 --dist loadfile -ra --tb=short \
            -p no:cacheprovider --timeout=900 --durations=40 --durations-min=0 \
            --testbudget-mode report --junitxml=junit-quick-cold.xml \
            --budget-json budget-quick-cold.json || true

      # Per-test times and per-file program counts of this cold run.
      - name: Upload the junit file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-quick-cold
          path: |
            junit-quick-cold.xml
            budget-quick-cold.json
          if-no-files-found: warn

      - name: Job summary
        if: always()
        env:
          REF: ${{ inputs.quick_ref }}
        run: |
          python budget-tools/.github/scripts/ci_summary.py junit-quick-cold.xml \
            --title "Quick tier, cold, at $REF" --allow-skips \
            --write-summary quick-cold-summary.json --commit "$(git rev-parse HEAD)" \
            --baseline budget-tools/.github/budget/quick_baseline.json \
            --max-increase-seconds 60 --advisory-baseline
