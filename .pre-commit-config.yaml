repos:
  - repo: local
    hooks:
      - id: no-internal-refs
        name: no internal research references
        entry: python3 tools/check_internal_refs.py
        language: system
        types: [text]
        exclude: ^(CHANGELOG\.md|tools/check_internal_refs\.py)$
      - id: check-domain-words
        name: no domain words in the core
        entry: python3 tools/check_domain_words.py
        language: system
        files: ^src/spaceodyssey/core/
        pass_filenames: false
      - id: check-core-imports
        name: core import boundary
        entry: python3 tools/check_core_imports.py
        language: system
        files: ^src/spaceodyssey/core/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: trailing-whitespace
      - id: name-tests-test
        args: [--pytest-test-first]
        # Support modules contain fixtures and helpers, not standalone test files.
        exclude: ^tests/(doubles|legacy_scan|pin_helpers|codec/run_cases|studies/survey_helpers|anchors/reference_geometry|core/refresh_helpers|core/((acquisition|award|battery|commitment|conformance|contract|draw|gate|kit|leak|lint|parity|prior|program|record|refund|status)_helpers|helpers|corpus|gradients|mutants|preflight_cases))\.py$
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
