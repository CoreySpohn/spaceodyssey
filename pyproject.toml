[tool.deptry]
known_first_party = ["spaceodyssey"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep it explicitly installed.
DEP002 = [
    "jaxlib",
    # Opt-in companion tools for user adapters, advertised in the library-stack diagram.
    "exojax",
    "physicaloptix",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/spaceodyssey"]
