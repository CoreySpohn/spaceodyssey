[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spaceodyssey"
description = "A JAX and Equinox simulator for Habitable Worlds Observatory mission studies: beliefs, claims, information and policies scored against a sealed world."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "equinox>=0.13.2",
  "jax>=0.8.1",
  "jaxlib>=0.8.1",
  "jaxtyping>=0.3.3",
]

[project.optional-dependencies]
dev = ["pre-commit"]
test = [
  "pytest>=7.3.2",
  "hypothesis>=6.79.1",
  "psutil>=5.9.4",
  "pytest-xdist>=3.4",
  "pytest-markdown-docs>=0.1.0",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
  "hwoutils>=1.15.0",
  "numpy>=2.2",
  "beartype>=0.18.5",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/spaceodyssey"
Issues = "https://github.com/CoreySpohn/spaceodyssey/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spaceodyssey/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceodyssey"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/tests", "/.github"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF", "NPY"]
# jaxtyping shape strings such as "A K G" are not forward annotations.
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions and fixtures do not need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
  "medium: tests with a 30-second default time budget",
  "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "spaceodyssey"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["spaceodyssey"]
optional_dependencies_dev_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
DEP002 = ["jaxlib"]
# The testbudget plugin imports pytest and uses psutil when available.
DEP004 = ["pytest", "psutil"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/spaceodyssey"]
