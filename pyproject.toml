[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spaceodyssey"
dynamic = ["version"]
description = "Astronomical analysis and observing campaigns: multi-visit observing programs with inference in the loop"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "equinox",
    "jax",
    "jaxlib",
    "scipy",
    "hwoutils",
    "optixstuff",
    "yippy",
    "orbix",
    "skyscapes",
    "jaxedith",
    "photomancy",
    "planit-py",
    "coronagraphoto",
    "coronachrome",
    "coronalyze",
]

[project.urls]
Repository = "https://github.com/CoreySpohn/spaceodyssey"
Documentation = "https://spaceodyssey.readthedocs.io"

[project.optional-dependencies]
retrieval = ["exojax"]
optics = ["physicaloptix"]
dev = ["pre-commit"]
test = ["pytest", "nox", "hypothesis", "pytest-cov"]
docs = [
    "myst-nb",
    "sphinx-autoapi",
    "sphinx-book-theme",
    "sphinx",
    "sphinx_autodoc_typehints",
    "ipython",
    "matplotlib",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spaceodyssey/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceodyssey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo checks; skip with -m 'not slow'"]
