[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "spaceodyssey"
dynamic = ["version"]
description = "Astronomical analysis and observing campaigns: multi-visit observing programs with inference in the loop"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "equinox>=0.13.2",
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "scipy>=1.13",
    "numpy>=2.1.2",
    "photomancy>=0.3",
    "planit-py>=0.2.0",
    "hwoutils>=1.10.0",
]

[project.urls]
Repository = "https://github.com/CoreySpohn/spaceodyssey"
Documentation = "https://spaceodyssey.readthedocs.io"

# Kinds a study document can name: group spaceodyssey.<family>, name <id>@<version>.
[project.entry-points."spaceodyssey.core"]
"study@1" = "spaceodyssey.core.study:Study"
"clock@1" = "spaceodyssey.core.study:Clock"
"agenda@1" = "spaceodyssey.core.study:Agenda"
"channel_table@1" = "spaceodyssey.core.ledger:ChannelTable"
"asset_table@1" = "spaceodyssey.core.ledger:AssetTable"
"capacities@1" = "spaceodyssey.core.capacities:Capacities"
"coupling@1" = "spaceodyssey.core.keys:Coupling"
"fork@1" = "spaceodyssey.core.keys:Fork"
"refresh_schedule@1" = "spaceodyssey.core.refresh:RefreshSchedule"
"effect_table@1" = "spaceodyssey.core.snapshot:EffectTable"
"stage@1" = "spaceodyssey.core.enums:Stage"
"event_kind@1" = "spaceodyssey.core.enums:EventKind"
"effect_kind@1" = "spaceodyssey.core.enums:EffectKind"
"scope@1" = "spaceodyssey.core.enums:Scope"
"disposition@1" = "spaceodyssey.core.enums:Disposition"
"record_status@1" = "spaceodyssey.core.enums:RecordStatus"
"purpose@1" = "spaceodyssey.core.enums:Purpose"
"admission_code@1" = "spaceodyssey.core.enums:AdmissionCode"
"coincident_order@1" = "spaceodyssey.core.enums:CoincidentOrder"
"charge_rule@1" = "spaceodyssey.core.enums:ChargeRule"
"remainder_rule@1" = "spaceodyssey.core.enums:RemainderRule"
"audience@1" = "spaceodyssey.core.enums:Audience"
"capacity@1" = "spaceodyssey.core.enums:Capacity"
"run_status@1" = "spaceodyssey.core.enums:RunStatus"
"charge_pricing@1" = "spaceodyssey.core.enums:ChargePricing"

[project.entry-points."spaceodyssey.observer"]
"toy.running_mean@1" = "spaceodyssey.studies.toy:ToyRunningMean"
"toy.refit_mean@1" = "spaceodyssey.studies.toy:ToyRefitMean"
"catalog.observer@1" = "spaceodyssey.studies.catalog:CatalogObserver"

[project.entry-points."spaceodyssey.policy"]
"toy.fixed_plan@1" = "spaceodyssey.studies.toy:FixedPlanPolicy"
"toy.threshold_stop@1" = "spaceodyssey.studies.toy:ThresholdStopPolicy"
"toy.spin_wait@1" = "spaceodyssey.studies.toy:SpinWaitPolicy"
"toy.null@1" = "spaceodyssey.studies.toy:NullPolicy"
"oracle.query@1" = "spaceodyssey.studies.oracle:QueryPolicy"

[project.entry-points."spaceodyssey.process"]
"toy.null@1" = "spaceodyssey.studies.toy:NullProcess"
"toy.heartbeat@1" = "spaceodyssey.studies.toy:HeartbeatProcess"
"scripted.records@1" = "spaceodyssey.studies.scripted:ScriptedRecords"

[project.entry-points."spaceodyssey.world_source"]
"toy.uniform_signal@1" = "spaceodyssey.studies.toy:ToyWorldSource"

[project.entry-points."spaceodyssey.channel_model"]
"toy.photometry@1" = "spaceodyssey.studies.toy:ToyPhotometry"

[project.entry-points."spaceodyssey.design"]
"toy.gain@1" = "spaceodyssey.studies.toy:ToyDesign"

[project.entry-points."spaceodyssey.objective"]
"toy.threshold@1" = "spaceodyssey.studies.toy:ToyObjective"

[project.optional-dependencies]
# Physical adapters: scenes (skyscapes), orbits and keepout (orbix), prior draws
# through photomancy's NumPyro model, and summary radiometry through jaxedith on a
# yippy response.
physical = [
    # jaxedith's fixed-frame variance and QE handling, optixstuff's dQE default and
    # skyscapes' FlatStar diameter are on main but unreleased; .github/sibling-pins.txt
    # pins those commits. Each floor moves to the first release that carries them.
    "skyscapes>=2.1",
    "orbix>=3.0",
    "numpyro>=0.21.0",
    "jaxedith>=2.0",
    "optixstuff>=4.0",
    # EqxCoronagraph.stellar_frame and stellar_pixel_scale_lod arrived in 2.12.0.
    "yippy>=2.12.0",
    "interpax>=0.3",
]
retrieval = ["exojax>=2.5"]
optics = ["physicaloptix>=2.3"]
viz = ["eyepiece>=0.16.0", "matplotlib>=3.11"]
dev = ["pre-commit>=3.6"]
test = [
    "pytest>=8.0",
    "hypothesis>=6.79.1",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.1.1",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "ineedvalidation>=1.1",
    "hwoutils>=1.14.0",
    "spaceodyssey[physical,viz]>=0.0.1",
    "yippy>=2.12.0",
    "astropy>=6.0",
    "mpmath>=1.3",
    "coronalyze>=1.2",
]
docs = [
    "myst-nb>=1.1",
    "sphinx-autoapi>=3.0",
    "sphinx-book-theme>=1.1.3",
    "sphinx>=7.3.7",
    "ipython>=8.18",
    "matplotlib>=3.11",
    "spaceodyssey[viz]>=0.0.1",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spaceodyssey/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceodyssey"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol-colors initializes colormaps with set_bad, pending deprecation in Matplotlib 3.11.
    'ignore:The set_bad function will be deprecated in a future version\.:PendingDeprecationWarning:tol_colors$',
    # ExoJAX 2.5.0 (imported by skyscapes scenes) redirects HAPI's import output to an
    # unclosed /dev/null stream; upstream code, not fixable here.
    "ignore:unclosed file.*name='/dev/null':ResourceWarning:exojax[.]database[.]_common[.]hitranapi$",
    # Invalid escapes in non-raw strings, emitted once on a cold (uncompiled) import by
    # hitran-api 1.3.0.0 (hapi/hapi.py), ExoJAX 2.5.0 (the seven modules listed) and
    # vaex-core 4.19.0 / vaex-viz 0.6.0 (functions.py, viz/contour.py, viz/mpl.py).
    'ignore:invalid escape sequence:SyntaxWarning:.*[/]site-packages[/]hapi[/]hapi$',
    'ignore:invalid escape sequence:SyntaxWarning:.*[/]site-packages[/]exojax[/](atm[/]atmprof|database[/]core_atom[/]broadening|database[/]mie|opacity[/]_common[/]lsd|rt[/]toon|rt[/]twostream|utils[/]isotopes)$',
    'ignore:invalid escape sequence:SyntaxWarning:.*[/]site-packages[/]vaex[/](functions|viz[/]contour|viz[/]mpl)$',
]
testpaths = ["tests"]
markers = [
    "slow: compile-heavy or Monte Carlo tests (see SLOW_FILES in tests/conftest.py); skip with -m 'not slow'",
    "medium: tests with a 30-second default time budget",
]

[tool.ineedvalidation]
library = "spaceodyssey"

[tool.ineedvalidation.defaults]
"tests/test_analytic.py" = { case = "yield-estimator", evidence = "code-verification" }
"tests/test_replicates.py" = { case = "yield-estimator", evidence = "code-verification" }
"tests/test_rng.py" = { case = "yield-estimator", evidence = "code-verification" }
"tests/test_dist.py" = { case = "yield-estimator", evidence = "code-verification" }
"tests/test_metrics.py" = { case = "yield-estimator", evidence = "code-verification" }
"tests/test_profile.py" = { case = "claim-profile", evidence = "code-verification" }
"tests/test_claim_outcome.py" = { case = "claim-profile", evidence = "code-verification" }
"tests/test_truth.py" = { case = "truth-model", evidence = "code-verification" }
"tests/test_plan.py" = { case = "plan-summary", evidence = "code-verification" }
"tests/test_viz_package.py" = { case = "visualization", evidence = "code-verification" }
"tests/test_viz_extract.py" = { case = "visualization", evidence = "code-verification" }
"tests/test_viz_plots.py" = { case = "visualization", evidence = "code-verification" }
"tests/" = { case = "mission-loop", evidence = "code-verification" }

[tool.testbudget]
library = "spaceodyssey"
mode = "enforce"
unit_s = 5
medium_s = 30
slow_s = 300
# A test is judged with its share of the setup of the fixtures it uses.
charge_fixture_setup = true
# Each file starts with no compiled programs, so its program count below does not
# depend on which files ran before it on the same worker.
clear_caches = true
# The per-file program budgets fail the run; runner and Mac counts agree within 3
# programs per file (cold Pilot and warm CI, 2026-11-09).
module_mode = "enforce"
# Every medium and slow mark states why the test cannot be cheaper.
require_tier_reason = true

# Programs each file compiles or loads from the persistent cache, the larger of the quick
# tier and the full suite, with headroom; regenerate with tools/program_budgets.py from
# --budget-json runs of both.
[tool.testbudget.module_compile_budget_by_file]
"tests/adapters/test_jaxedith_summary.py" = 1078
